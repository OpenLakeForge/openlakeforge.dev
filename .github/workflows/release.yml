name: Release

# Pushing a tag vX.Y.Z (matching package.json) builds the site and deploys it
# to Cloudflare at https://openlakeforge.dev. workflow_dispatch redeploys a
# tag by hand, for example after a docs.lock bump.
#
# Needs two repository secrets, scoped to the "production" environment:
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" on the account
#                          and "Workers Routes: Edit" + "DNS: Edit" on the
#                          openlakeforge.dev zone
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the zone

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://openlakeforge.dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: The tag matches package.json
        if: github.event_name == 'push'
        run: |
          test "$(jq -r .version package.json)" = "${GITHUB_REF_NAME#v}" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $(jq -r .version package.json)"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://openlakeforge.dev

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.151.2"
